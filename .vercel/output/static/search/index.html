5] = [1, 2, 3, 4, 5];&lt;br /&gt;let a: (i32, string, char) = (23, \&quot;hello\&quot;, &#39;z&#39;);&lt;/pre&gt;\n&lt;p&gt;Slices are contiguous sequences of elements in a collection rather than a whole array. It&#39;s a kind of a reference.&lt;/p&gt;\n&lt;p&gt; &lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;programming-language-t&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Programming Language: T&quot;],&quot;description&quot;:[0,&quot;https://github.com/ahmetson/tpl&quot;],&quot;date&quot;:[3,&quot;2023-12-21T11:36:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;programming-language&quot;],[0,&quot;programming-language-by-ahmetson&quot;],[0,&quot;project&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;https://github.com/ahmetson/tpl\&quot;&gt;https://github.com/ahmetson/tpl&lt;/a&gt;&lt;/p&gt;&lt;p&gt;A programming language with the Turkmen language syntax.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;programming-language-rigidity&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Programming Language: Rigidity&quot;],&quot;description&quot;:[0,&quot;https://github.com/ahmetson/rigidity&quot;],&quot;date&quot;:[3,&quot;2023-12-21T11:35:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;programming-language&quot;],[0,&quot;programming-language-by-ahmetson&quot;],[0,&quot;project&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;https://github.com/ahmetson/rigidity\&quot;&gt;https://github.com/ahmetson/rigidity&lt;/a&gt;&lt;/p&gt;&lt;p&gt;A secure version of Solidity to write smartcontracts.&lt;/p&gt;&lt;p&gt;It&#39;s a type driven inspired by programming languages such as Idris.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;revv-revv&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Revv (REVV)&quot;],&quot;description&quot;:[0,&quot;14 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:43:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;blockchain&quot;],[0,&quot;blockchain-review&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;14 May 2021&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://www.revvmotorsport.com/\&quot;&gt;https://www.revvmotorsport.com/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;It&#39;s the main cryptocurrency for the identical branded motorsports blockchain game titles produced by Animoca Brands.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;rnb-blockchain-whitepaper&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;RNB Blockchain whitepaper&quot;],&quot;description&quot;:[0,&quot;9th May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T09:01:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;blockchain&quot;],[0,&quot;project&quot;],[0,&quot;project-rng&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;9th May 2021&lt;/em&gt;&lt;/p&gt;&lt;h1&gt;&lt;strong&gt;OVERVIEW&lt;/strong&gt;&lt;/h1&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Generating secure random numbers is a challenging task. By fast numbers, I mean that a) predicting what the next number is impossible, and b) &amp;nbsp;It generates numbers without putting them in favor of one of the stakeholders.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;The nature of public blockchain, with its decentralized p2p architecture, is ideal for producing secure numbers.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;This whitepaper discusses the implementation of secure random numbers using blockchain.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;h1&gt;&lt;strong&gt;GOALS OF THE PROJECT&lt;/strong&gt;&lt;/h1&gt;&lt;ol&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Free public random number generator&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Secure, where numbers are not predictable.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Generated numbers are stored in the database permanently for checking in the future&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Generated numbers are not programmed to drop specific numbers with high probability.&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;h1&gt;&lt;strong&gt;RNG V 0.0 User-generated numbers&lt;/strong&gt;&lt;/h1&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Since the creation of the blockchain takes some time, we decided to make a quick version of the RNG. This short version of the RNG blockchain is versioned as 0.0.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;In this version, the nodes accessing the RNG send a random number in their transactions. The sum of all random numbers divided by all senders within the block is defined as a new Random number for the block.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;The RNG V 0.0 will have the following transitions:&lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Request a new Random number &amp;nbsp; (DONE)&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;- accepts (one random number) in byte32 format. This number is used to generate a random number. To get a random number, the caller should stake some tokens.&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;- returns another random number in byte32 format. It requires 0.01 RNG tokens to be cut from the staked RNG tokens.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Send a random number&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;- accepts (one random number) in byte32 format. This transaction could be sent by participating validators only.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Stake a token&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;- Stake 100 RNG tokens. It will register a user to generate a random number. A new stake will be added to the previous ones if a user has already staked tokens.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Get a staked token amount&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;- accepts a wallet address&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;- returns an amount of staked tokens for the user.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Change fee&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;- accepts a new fee for requesting a Random Number&amp;nbsp;and deadline (up to 24 hours in seconds and a minimum of&amp;nbsp;1 hour).&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;- whether this was accepted.&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;If ⅔ of the users call this transaction with the same fee, the fee for requesting payment will be updated.&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h1&gt;&lt;strong&gt;RNG V 1.0 THEORETICAL SPECIFICATIONS&lt;/strong&gt;&lt;/h1&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;How does the RNG blockchain work without going to the programming language and technology used in it?&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;The idea is that the RNG blockchain generates random numbers in every block of the blockchain.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;All validators of the RNG blockchain must provide a unique wallet address for every block for consensus voting. The sum of all unique wallet addresses divided by the number of voters is the Generated Random number of that block.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;We came up with three solutions to prove that the signature is nondeterministic.&lt;/span&gt;&lt;/p&gt;&lt;ol&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Any node that participates in the generation of random numbers also has a representative signature. This signature stakes 100 RNG tokens, which allows this node to participate in number generation. Any unique signature used once can be used to withdraw 50% of the staked RNG tokens per user from the blockchain within the next 30 days after usage of the signature. Suppose the unique signature is used for withdrawing a token. In that case, the representative node is kicked out from the participation of random number generation, while the rest of 50% of staked RNG tokens are redistributed among other stakeholders. &lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;So, it is in the interest of all stakeholders to try to find the signature or guess it for the other stakeholders to prevent them from cheating.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;The node client should always be public, meaning everyone could join the blockchain for random number generation without anyone’s permission. Since the sum of the hash of all wallets is changing dramatically even after the addition of one more signature, it will allow the blockchain to be unpredictable if many nodes connect to the blockchain from around the world.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;There is the option where anyone, whether a unique signature or representative signature or not related to the RNG signature, can put 1 RNG token, the future block number, and the possible value. If the value generated in the future in the block number is correct, the wallet address could take 50% of all stake RNGs in the blockchain. This will keep all stakes trying to put unpredictable signatures, while those who want to earn money will always try to check the blockchain for prediction. This will ensure that generated random numbers are safe.&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;h2&gt;&lt;strong&gt;RNG Blockchain Technical Requirements&lt;/strong&gt;&lt;/h2&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;It is a blockchain in Cosmos Network created with Cosmos SDK on the tendermint core. RNG blockchain has the following features:&lt;/span&gt;&lt;/p&gt;&lt;ol&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;A lightweight client&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;States in key-value format: &lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;2.1. A list of all unique addresses of every representative address.&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&amp;nbsp; &amp;nbsp; Representative Account =&amp;gt; array of unique addresses&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&amp;nbsp; &amp;nbsp; Unique address =&amp;gt; representative&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;2.2 List all random numbers since block one, including unique addresses and their numbers.&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&amp;nbsp; &amp;nbsp; Block number =&amp;gt; struct(random_address, array(unique addresses), unique_address_amount, proposer)&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;2.3 A list of representative addresses with their staked RNG tokens amount.&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&amp;nbsp; &amp;nbsp; Representative stake =&amp;gt; stake amount&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;2.4 A balance of each address of RNG tokens that are not used for staking:&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&amp;nbsp; &amp;nbsp; Wallet address =&amp;gt; balance&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;2.5 A prediction list for each block&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&amp;nbsp; &amp;nbsp; Block number =&amp;gt; array of Structs(predicted_address, payment_address)&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&amp;nbsp; &amp;nbsp; Prediction reserves =&amp;gt; balance.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Functions such as&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;3.1 Stake RNG tokens to add a representative token to the data structure 2.3&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;3.2 A function to push unique address for generating random numbers, &lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;3.3 Generating random number by the sum of all unique addresses pushed to the server, &lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;3.4 Unstaking tokens with the representative address&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;3.5 Unstaking tokens with a unique address, which automatically distributes 50% of staked tokens to other token holders, while 50% goes to the individual address&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;3.6 claim additional tokens for stakes that they got from other stake token distribution, &lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;br /&gt;&lt;/span&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;3.7 Spend 1 RNG with the random number and the block to predict the upcoming number to withdraw 50% of all staked tokens.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;An easy RPC to fetch the random number by event broadcast or rest API.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;A bridge to the Ethereum blockchain where RNG tokens are minted. Bridge to transfer into or out from rng blockchain rng tokens.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;an intelligent contract on the Ethereum blockchain locks RNGs transferred to the RNG blockchain.&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&lt;strong&gt;RNG blockchain Technical implementation&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;We edit the voter module by adding additional features, such as auto-generating the private keys that voters submit to the block (automatically by the module). The voter module will store the private keys in the local storage, encrypted by the voter’s primary signature.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;We will also create a new rng-history module to store all the rng states. This module is connected to the voter module to get the voter’s signatures.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Finally, we edit the consensus module to connect to the rng-history module to write data into rng states.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;RNG token&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;RNG tokens are erc20 tokens on the Ethereum blockchain. USDT tokens back them.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;1 usdt = 10 rng token.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;If a user wants to mint 100 RNG tokens, he has to call the mint function of the RNG token. The mint function will lock ten USD on behalf of the user to issue RNG tokens.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;If a user wants to take back his USDT tokens used to mint RNG tokens, then the user calls the burn method in the RNG token, which will burn RNGs while transferring the locked USDTs to the user.&lt;/span&gt;&lt;/p&gt;&lt;h1&gt;&lt;strong&gt;MILESTONES&lt;/strong&gt;&lt;/h1&gt;&lt;h2&gt;&lt;strong&gt;Write the whitepaper&lt;/strong&gt;&lt;/h2&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Till 16th May, write all technical aspects of the RNG blockchain and RNG token.&lt;/span&gt;&lt;/p&gt;&lt;h2&gt;&lt;strong&gt;Write the Demo blockchain (without bridge)&lt;/strong&gt;&lt;/h2&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Till the end of May 2021, write the RNG blockchain using Cosmos SDK.&lt;/span&gt;&lt;/p&gt;&lt;h2&gt;&lt;strong&gt;Write the RNG token&lt;/strong&gt;&lt;/h2&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Till 10th June 2021, write the RNG token with mint and burn functions.&lt;/span&gt;&lt;/p&gt;&lt;h2&gt;&lt;strong&gt;Write the Bridge blockchain.&lt;/strong&gt;&lt;/h2&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Till 20th June&amp;nbsp;2021, write the RNG bridge between the RNG blockchain and the&amp;nbsp;Ethereum blockchain.&lt;/span&gt;&lt;/p&gt;&lt;h2&gt;&lt;strong&gt;Launch of the product&lt;/strong&gt;&lt;/h2&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Till 30th June 2021, test the system and launch it.&lt;/span&gt;&lt;/p&gt;&lt;h2&gt;&lt;strong&gt;Write the Whitepaper 2.0 for the profitable version of the RNG blockchain&lt;/strong&gt;&lt;/h2&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;How do RNG blockchain nodes earn money? In the next version of the blockchain, this should be possible.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;br /&gt;&lt;br /&gt;&lt;br /&gt;&lt;br /&gt;&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;so-called-armenian-genocide&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;So called Armenian Genocide&quot;],&quot;description&quot;:[0,&quot;20 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:13:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;people&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;20 May 2021&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;There is no proof that the Turkish government ordered a systematic extermination of some group of people based on nationality or religion.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;All the sources claiming that there was an order are nonprovable; only someone heard that Enver Pasha did it in private talk. Who was this guy who told it? The Western sources don&#39;t want to show any argument supporting their words.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Besides that, some information makes me suspicious about this situation.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;ol&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;some sources quoted that Hitler was inspired by the Armenian genocide and quoted it for the holocaust. Recently, it was proven to be wrong.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;There is a famous picture on the internet where the officer is teasing kids with bread while they are starving. First, it was released by the Oxford Book regarding the Genocide. Later, it was proven that the picture was photoshopped, and Oxford publishers took it from some random Armenian guy.&lt;/span&gt;&lt;/li&gt;&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;The first two countries that acknowledged the genocide are South America’s little countries, not the major powers of the west. Certainly, someone pushed those countries to accept it.&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;After three points, I feel like&amp;nbsp;the Armenian Genocide is a political movement rather than a historical thing pushed to the world by the&amp;nbsp;Armenian Diaspora.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;steve-jobs-is-not-a-role-model&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Steve Jobs is not a role-model&quot;],&quot;description&quot;:[0,&quot;I use Steve Jobs&#39; own words: \&quot;Innovations lead to the innovations\&quot;. His own company, his own products don&#39;t lead to the technical innovations. When you read the history, when there are no new ideas, but a sophistication of what was built, this indicates a decline&amp;hellip;&quot;],&quot;date&quot;:[3,&quot;2024-01-15T01:00:12.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;persona&quot;],[0,&quot;people&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;I use Steve Jobs&#39; own words: \&quot;Innovations lead to the innovations\&quot;.&lt;/p&gt;\n&lt;p&gt;His own company, his own products don&#39;t lead to the technical innovations.&lt;/p&gt;\n&lt;p&gt;When you read the history, when there are no new ideas, but a sophistication of what was built, this indicates a decline of the culture. A slow stagnation.&lt;/p&gt;\n&lt;p&gt;If we value products like iPhone, MacBook for it&#39;s candy-crash like UI as the greatest thing in the technology, then it&#39;s clearly marks the stagnation of the culture.&lt;/p&gt;\n&lt;p&gt;I use iPhone (my family bought me as a gift), it never lead me to build something with it. So for me neither Apple, neither Steve Jobs are respected nor role model.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;p&gt;I think they have important in the popularization of the technology. Apple is like Chinese internet, it takes the app and packs it in a nice user interface.&lt;/p&gt;\n&lt;p&gt;These kind of products should be respected by UX designers, not by technology companies. They should take Apple as a role model when it comes to the intuitive user experience when using the technology.&lt;/p&gt;\n&lt;p&gt;To give you analogy, you can&#39;t say google is the better than Yahoo in terms of technology because Google has a minimalistic main page. But that is going on with the Apple.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;the-preda-guide&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;The Preda Guide&quot;],&quot;description&quot;:[0,&quot;Preda is a programming language to write distributed intelligent contracts that can execute transactions in parallel. If you are unfamiliar with the smart contract or want to see what Preda is, look at Programming Language: Preda, where I wrote some notes about it. This page&amp;hellip;&quot;],&quot;date&quot;:[3,&quot;2023-12-27T09:40:44.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;technology&quot;],[0,&quot;project&quot;],[0,&quot;programming-language&quot;],[0,&quot;preda-programming-language&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;Preda is a programming language to write distributed intelligent contracts that can execute transactions in parallel. If you are unfamiliar with the smart contract or want to see what Preda is, look at &lt;a href=\&quot;https://turkmenson.com/programming-language-preda.html\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Programming Language: Preda&lt;/a&gt;, where I wrote some notes about it.&lt;/p&gt;\n&lt;p&gt;This page describes the projects I wrote in the Preda programming language: \&quot;&lt;a href=\&quot;https://lu.ma/co44nv4x\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Preda Scale-out Smart Contracts Hackathon&lt;/a&gt;\&quot;.&lt;/p&gt;\n&lt;p&gt;The best way to learn a technology is by creating something. I will also provide general lessons and valuable resources that helped me write something on Preda.&lt;/p&gt;\n&lt;h1&gt;Brainstorming&lt;/h1&gt;\n&lt;p&gt;For the hackathon, we need some ideas to work on. The project will benefit from the parallel execution.&lt;/p&gt;\n&lt;h2&gt;Invalid directions&lt;/h2&gt;\n&lt;h3&gt;Top Smartcontracts&lt;/h3&gt;\n&lt;p&gt;As Preda was targeting top smartcontracts, let&#39;s take inspiration from them. However, complete intelligent contracts are all for DeFi. DeFi doesn&#39;t solve real-world problems, so let&#39;s skip it. &lt;/p&gt;\n&lt;h3&gt;Top Transactions&lt;/h3&gt;\n&lt;p&gt;The Bridges and Exchanges load the highest traffic on Ethereum. These smartcontracts are easy to implement, so let&#39;s skip it.&lt;/p&gt;\n&lt;h2&gt;Right direction&lt;/h2&gt;\n&lt;p&gt;The best way is to implement something impossible with the current smartcontracts and only available with the Preda&#39;s parallel execution.&lt;/p&gt;\n&lt;p&gt;But before working on it, let&#39;s create small intelligent contracts to have an understanding of the program in Preda.&lt;/p&gt;\n&lt;p&gt;And lastly, we are always relying on the libraries with the best practices that save us a lot of headaches.&lt;/p&gt;\n&lt;p&gt;So, here is the list of the projects that I will be working on:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;(Library 1) The OpenZeppelin library is a state-of-the-art library for Ethereum. Let&#39;s convert it to Preda to bootstrap the creation of smart contracts.&lt;br /&gt;&lt;br /&gt;&lt;/li&gt;\n&lt;li&gt;(Library 2) OpenZeppelin Upgradables: This is an interesting part of creating an upgradable contract. Maybe upgrade a certain state, rather than all smartcontract?&lt;/li&gt;\n&lt;li&gt;(Small project 1) Mistransfer: a project that recovers tokens sent to a wrong smart contract. I wrote it for a Chainlink hackathon. And I believe it should be everywhere. So, let&#39;s implement it.&lt;/li&gt;\n&lt;li&gt;(Small project 2) Malpie: a loyalty program for apps where users provide their data in exchange for a product discount.&lt;/li&gt;\n&lt;li&gt;(Project)Where does Preda outshine? What kind of app is it possible to make on the blockchain? More in the next section.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3&gt;Real-time app&lt;/h3&gt;\n&lt;p&gt;Parallel execution enables real-time applications that were not possible on the blockchain before. What kind of real-time app? Do you know the original motivation behind the creation of the Ethereum?&lt;/p&gt;\n&lt;p&gt;According to the legends, Vitalik was playing World of Warcraft, and one day, Blizzard Studio decided to remove one of his favorite game items. Outraged, he created a distributed platform where \&quot;Code is a law.\&quot; It&#39;s a beautiful legend, so let it be.&lt;/p&gt;\n&lt;p&gt;However, Ethereum doesn&#39;t allow the creation of a game such as World of Warcraft. But with Preda, we can create it. Each popular multiplayer, real-time game is a session. With Preda, we can make each session a scope with access from the users in that session. This allows, for example, to create a Layer 2 on Ethereum with the PREDA model. Fine-tuned, it could keep thousands of users online with less technical cost than without Preda.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h1&gt;Preda tricks&lt;/h1&gt;\n&lt;p&gt;return type is inserted in the beginning after the \&quot;function\&quot; keyword.&lt;/p&gt;\n&lt;p&gt;to make the contract read-only, replace \&quot;view\&quot; with \&quot;const.\&quot;&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;the-sandbox-sand&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;The Sandbox (SAND)&quot;],&quot;description&quot;:[0,&quot;14 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:50:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;blockchain&quot;],[0,&quot;blockchain-review&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;14 May 2021&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://www.sandbox.game/\&quot;&gt;https://www.sandbox.game/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;According to the whitepaper, the Sandbox&#39;s primary mission is to introduce blockchain technology in mainstream gaming successfully.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;turkmenistans-problem&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Turkmenistan&#39;s Problem&quot;],&quot;description&quot;:[0,&quot;14 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T07:55:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;people&quot;],[0,&quot;turkmen&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;14 May 2021&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;The problem with Turkmenistan is that Turkmen is a sleepy nation.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Sleepy nations have zero interest in politics, in god. They are interested in their comfortable life. As Turkmens like to say, the most important thing is your health.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Sleepy nations are also self-centered, without any compassion for other people. As such, cooperation for common benefit is weird for them. Why would they talk to each other for a common benefit if talking to others is not resulting because others won’t do the same?&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Moreover, sleepy people can’t trust others. They only expect some terrible behavior from them.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;As such, the Turkmen value only their health and their family. Turkmen can sacrifice their political freedom in exchange for a wealthy life with one car and one good house. That’s what the current government in Turkmenistan promises. Turkmens don’t care how others view the head of state; just that he made them reach is enough for them.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Many Turkmen say it occurred only in the last 30 years, and they like to blame the President. Others say it happened in Soviet times. However, they both are wrong. Turkmen were sleepy throughout all of its history.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;The reason why Turkmens founded empires was not because of Islam or because Turkmens had to. It’s because of Oghuzes who used Turkmens for it. Turkmen&#39;s political raids on Alaman were not because they were warriors but because of the desert pushing Turkmen for water pastures.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Once Turkmen have solved the water resources, they will be a silent nation again that won’t interact about anything with other people.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;And finally, sleepy nations are blind to the knowledge. They can’t see the hidden values, so they can’t appreciate the education. And without education, you can’t control your life. He will always be dependent on other people who know him.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;So, why should we awaken Turkmens? Why should we make it our goal? First, we need to understand human nature because it has become apparent.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Human nature?&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;turkmens-are-descendants-of-oghuzes-and-persians&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Turkmens are descendants of Oghuzes and Persians?&quot;],&quot;description&quot;:[0,&quot;Turkmen are primarily descendants of Iranian nomads who lived between the Aral Sea and the Caspian Sea. When you are learning the history of a nation, you do a comprehensive analysis of the country from all aspects: tradition, language, and anthropology. Most people who talk&amp;hellip;&quot;],&quot;date&quot;:[3,&quot;2023-12-27T05:55:53.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;turkmen&quot;],[0,&quot;people&quot;],[0,&quot;history&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;Turkmen are primarily descendants of Iranian nomads who lived between the Aral Sea and the Caspian Sea.&lt;/p&gt;\n&lt;p&gt;When you are learning the history of a nation, you do a comprehensive analysis of the country from all aspects: tradition, language, and anthropology. Most people who talk about Turkmen as people who came from Altai do not know who the Turkmen are or their traditions.&lt;/p&gt;\n&lt;p&gt;Without knowing the history, you might get the generalized view that ancient Turkmen were nomadic warriors who drank horse milk and ate horse meat. They were a people with slanted eyes and built Kurgans for their ancestors.&lt;/p&gt;\n&lt;p&gt;But Turkmens didn&#39;t have slanted eyes, except for the minority. They never farmed horses for meat or milk. And they never built Kurgans for the ancestors.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;p&gt;Regarding horse tradition, Turkmenians raised horses for races and battles only. These breeds, in medieval times, were known as &lt;a href=\&quot;https://en.wikipedia.org/wiki/Turkoman_horse\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Turkoman Horses&lt;/a&gt;. These horses are the ancestors of all racing horses in the world. The German Trakehner breed&#39;s ancestor: \&quot;Turkmen Atti\&quot;&lt;/p&gt;\n&lt;figure class=\&quot;post__image\&quot;&gt;&lt;img loading=\&quot;lazy\&quot;  src=\&quot;https://www.artnet.com/WebServices/images/ll00852lldxe6FFgneECfDrCWvaHBOcSeK/johann-meno-haas-turcmainatti.jpg\&quot; alt=\&quot;&amp;quot;Turcmainatti&amp;quot; , 1795–1795\&quot; width=\&quot;618\&quot; height=\&quot;470\&quot; data-is-external-image=\&quot;true\&quot; /&gt;&lt;/figure&gt;\n&lt;p&gt;&lt;a href=\&quot;https://www.artnet.com/artists/johann-meno-haas/turcmainatti-SgqtHdf3XfLTfFtUN_nTgA2\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Turcmanatti by Johan Meno Haas in the 1790s.&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt; &lt;/p&gt;\n&lt;p&gt;The English Throughbroud&#39;s ancestor: Byerly Turk:&lt;/p&gt;\n&lt;figure class=\&quot;post__image\&quot;&gt;&lt;img loading=\&quot;lazy\&quot;  src=\&quot;https://upload.wikimedia.org/wikipedia/commons/e/ec/Byerly_Turk.jpg\&quot; alt=\&quot;Byerly Turk by John Wootton\&quot; width=\&quot;500\&quot; height=\&quot;400\&quot; data-is-external-image=\&quot;true\&quot; /&gt;&lt;/figure&gt;\n&lt;p&gt;You do a DNA analysis, and the closest to all horses are not Arabian, but Akhal Teke (one of the lineage of Turkmen horses named after the Teke tribe).&lt;/p&gt;\n&lt;p&gt;The Turkmen horses are indigenous to Central Asia and have been famous since the Antique period. The Chinese conquered modern Xinjiang, part of Central Asia, to acquire these horses as they were well-known there as Heavenly horses.&lt;/p&gt;\n&lt;p&gt;Ancient Greek and Roman historians described them as the best in the world. This breed has thousands of years of history. And while the breed&#39;s name has changed, it&#39;s still part of Antique Central Asian history.&lt;/p&gt;\n&lt;p&gt;But here is the thing: Neither Central Asian sedentary Iranians nor Nomadic Turk-Mongolian people except Turkmens were breeding them. From the ancient nomads, this tradition is carried out by Turkmens. And not by one tribe in the region to say it&#39;s the influence, but by all tribes, so it&#39;s part of national culture.&lt;/p&gt;\n&lt;p&gt;A depiction of &lt;a href=\&quot;https://reddead.fandom.com/wiki/Turkoman\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Turkmen horse in the Read Dead Redemption 2&lt;/a&gt; (click to see on Wiki Fandom): &lt;/p&gt;\n&lt;figure class=\&quot;post__image\&quot;&gt;&lt;img loading=\&quot;lazy\&quot;  src=\&quot;https://static.wikia.nocookie.net/reddeadredemption/images/0/0b/Black_Turkoman.PNG/revision/latest/scale-to-width-down/350?cb=20221216080258\&quot; alt=\&quot;\&quot; width=\&quot;350\&quot; height=\&quot;272\&quot; data-is-external-image=\&quot;true\&quot; /&gt;&lt;/figure&gt;\n&lt;p&gt; The same goes for all other aspects of Turkmen culture. Turkmen have a heavy influence from other people around them and, to a lesser degree, by people along the \&quot;Silk Road\&quot;. But it&#39;s a cultural exchange that went bidirectional. As much as Turkmens have it, they also influenced other people.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;p&gt;This is the problem of Iranians. When they see Iranian influence, they brag about Greater Iran. Still, when influenced, they want to dismiss the national terminology, discussing regional and Islamic shared culture. To make it fair, either ignore \&quot;Iranian\&quot; influence by removing national appearance. Or accept that you have Arabic and Turkic influence, too.&lt;/p&gt;\n&lt;p&gt;This is especially seen on Wikipedia, where Nowruz is an Iranian national holiday and Iranian influence. Just like anything that interacted with them. But Turkmen carpets are Iranian because they&#39;re part of their day-to-day culture, and they should not be connected with Turkmen only.&lt;/p&gt;\n&lt;p&gt; &lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;ultra-uos&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Ultra (UOS)&quot;],&quot;description&quot;:[0,&quot;14 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:46:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;blockchain&quot;],[0,&quot;blockchain-review&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;14 May 2021&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://ultra.io/\&quot;&gt;https://ultra.io/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;A blockchain-based PC game distribution platform designed to provide both gamers and game developers with new opportunities. It consists of an ecosystem where gamers can buy games, play games, resell their used games and items.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;vanilla-network-vnla&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Vanilla Network (VNLA)&quot;],&quot;description&quot;:[0,&quot;14 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:35:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;blockchain&quot;],[0,&quot;blockchain-review&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;14 May 2021&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://vanilla.network/home\&quot;&gt;https://vanilla.network/home&lt;/a&gt;&lt;/p&gt;&lt;p&gt;It relies on fundamental economics to produce an equilibrium price based on demand and supply.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;you-are-lonely-without-your-nation&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;You are lonely without your nation.&quot;],&quot;description&quot;:[0,&quot;20 august 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T07:45:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;god&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;20 august 2021&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Imagine, at the party, you destroyed your relationship with people around you in a foreign country.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;You sit on your motorbike, then ride somewhere. I can’t say where because it was in my dream.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Then, you got in a traffic accident right next to the motorbike repair service. You see, their reaction is zero. No laugh, no empathy. Feels lonely.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;You stand up and walk by the street. Suddenly you see a smiling face. She is not that beautiful, but still charismatic. You felt lonely and wanted to talk to someone.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;You talk to her, she replies. Then, you ask her, “Where is she from?” She replies, “&lt;strong&gt;&lt;em&gt;Turkmenistan&lt;/em&gt;&lt;/strong&gt;”. And imagine you are also from that country. You respond with excitement, “&lt;em&gt;&lt;strong&gt;I am from Turkmenistan&lt;/strong&gt;,&lt;/em&gt;” as well.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;&lt;em&gt;It’s a small, landlocked country right at the center of Asia. It&#39;s exotic, so you barely see anyone who even knows the name of the land. And she replies, “I know”, to your excited comment&lt;/em&gt;.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Then you ask her what she is doing; she replies, “Programming, development”. The same thing as you do. You are more excited, as you’ve met a person who has a similar lifestyle. Even her cold answers, her eyes looking at the road, when she replies to you, don’t matter. She then replies, “But I will not do business in China”. You planned that, too. It&#39;s hard to create a company in China as a foreigner. So you ask her, “Oh, you wanted to gain experience in China, then travel to the West to set up your business?”. But she is ghosting you. What happened? Nothing.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;You open your phone; you want to see or talk to Turkmens after seeing your countrymate. And in the groups, you read that admins kicked you out. You felt so sad, so depressed.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;You want to see Turkmens; even if you don’t want to talk, you still want to be in a company and feel part of it. It&#39;s beneficial not to feel abandoned in the harsh times. And it&#39;s not going to happen.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;They reject you. Turkmens are ignoring you in your hard times. They ghost you speaking, even in real life. What is that? How much would you feel if your parents left you?&lt;/span&gt;&lt;/p&gt;&quot;]}]]]}" ssr client="load" opts="{&quot;name&quot;:&quot;SearchBar&quot;,&quot;value&quot;:true}" await-children><div class="min-h-[45vh]"><input class="form-input w-full" placeholder="Search posts" type="text" autoComplete="off" autofocus="" name="search" value=""/><div class="row"><div class="mx-auto px-0 lg:col-8"></div></div></div><!--astro:end--></astro-island> </div> </section>  </main> <footer class="bg-light section"> <div class="container text-center"> <div class="row items-center"> <div class="lg:col-6">  <ul class="space-x-4"> <li class="inline-block"> <a href="/privacy-policy" class="text-text hover:underline lg:p-4"> Privacy Policy </a> </li> </ul> </div>  <div class="mt-8 lg:col-6 lg:mt-0"> <ul class="social-icons"> <li> <a aria-label="X" href="https://x.com/mahmetson" target="_blank" rel="noopener noreferrer nofollow"> <span class="sr-only">X</span> <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 512 512" class="inline-block" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M389.2 48h70.6L305.6 224.2 487 464H345L233.7 318.6 106.5 464H35.8L200.7 275.5 26.8 48H172.4L272.9 180.9 389.2 48zM364.4 421.8h39.1L151.1 88h-42L364.4 421.8z"></path></svg> </a> </li><li> <a aria-label="github" href="https://www.github.com/ahmetson" target="_blank" rel="noopener noreferrer nofollow"> <span class="sr-only">github</span> <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 496 512" class="inline-block" height="1em" width="1em" xmlns
