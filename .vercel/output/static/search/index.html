y, cryptocurrency gaming, and marketing App available on Android and IOS App stores. Users can hunt for and collect cryptocurrencies within an interactive AR environment based on geolocation similar to Pokemon Go. The Aircoins team claims to have partnered with over 25 crypto projects, acquiring 27,000 active users with over 13M coins collected within the platform.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;ara&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Ara&quot;],&quot;description&quot;:[0,&quot;Computers are the best technology for expressing and exploring our minds. The result of expressing our thoughts through computers produces structured, precise information. This information has various names: All this information has unique characteristics: the computers or software could execute the data, including the conditions.&quot;],&quot;date&quot;:[3,&quot;2024-01-15T02:04:01.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;technology&quot;],[0,&quot;project&quot;],[0,&quot;ara&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;Computers are the best technology for expressing and exploring our minds. The result of expressing our thoughts through computers produces structured, precise information. This information has various names:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Code&lt;/li&gt;\n&lt;li&gt;Model (in machine learning)&lt;/li&gt;\n&lt;li&gt;Program&lt;/li&gt;\n&lt;li&gt;Software&lt;/li&gt;\n&lt;li&gt;Smartcontract (in blockchain)&lt;/li&gt;\n&lt;li&gt;Script&lt;/li&gt;\n&lt;li&gt;Instructions&lt;/li&gt;\n&lt;li&gt;Algorithm&lt;/li&gt;\n&lt;li&gt;etc.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;All this information has unique characteristics: the computers or software could execute the data, including the conditions. That means they process the information partially depending on the condition. &lt;/p&gt;\n&lt;p&gt;Computers could partially replicate our brain activity. It&#39;s not meant to replicate fully our brain to replace us in the future. It&#39;s not meant to delegate some of our brain activity to automate human tasks. The main goal of computers is to increase our brain activity, including our imagination.&lt;/p&gt;\n&lt;p&gt;Analogously, consider our brain as the laptop hardware. Then the computers are the USB, which adds extra storage. The USBs are pluggable mobile but have less hardware capacity. But with the USB, we can share the data between multiple laptops.&lt;/p&gt;\n&lt;p&gt;The ability of computers to share data over the internet is crucial. In analogy, the internet is the mobility and pluggable parameter of computers. Surprisingly, the original pioneers of computers haven&#39;t considered the internet part of computers.&lt;/p&gt;\n&lt;p&gt;But why is the internet a crucial part of computers? Because software is a product of our thinking. For us, the most necessary aspect is to share our ideas. One person does not build ideas. It always relies on the ideas of other people. You need other ideas for the information; you need others not to reinvent the wheels but to use what others built as giants by simply improving their ideas. You need others who would help you to improve your idea. We may need to collaborate on complex ideas with others. Lastly, our inner child tells us to share what we know with others.&lt;/p&gt;\n&lt;p&gt;Thus, computers mediate between people in real-time or from different eras to work on the idea. Software is meant to be created by people for other people. Even if it&#39;s not the code itself, the user of the software or the result of the software must be for other people.&lt;/p&gt;\n&lt;p&gt;Thus, we need to understand the internet as the inter-connected software, where everyone can change and modify the software. Understanding the internet opens up the true potential of computers for us. Understanding the internet opens up new software that has not yet been seen worldwide.&lt;/p&gt;\n&lt;p&gt;One potential kind of software is folk software. It&#39;s software created by one person. Then, it was improved over time by other people. It might shift from its original form. The second important aspect of folk software is that it has a general version and different variants per user or group of users.&lt;/p&gt;\n&lt;p&gt;Consider, for example, video-sharing software, YouTube. If YouTube was folk software,  the current version would be generic. But every user might have YouTube with a different feature set. For example, some people would prefer to see a 10-star rating instead of the like buttons. Others would want to see the auto-pausing after a few seconds.&lt;/p&gt;\n&lt;p&gt;Sadly, YouTube is not a folk software. It&#39;s an online service with full ownership belonging to Google. When you were using the software, how many times have you wished it had the feature but didn&#39;t? Maybe you were sending a request to the developers to add that feature? Sadly, a current industry driven by profit would add the feature if it aligns with the profit they get, not by what is needed for a specific user.&lt;/p&gt;\n&lt;p&gt;Even when you use software offline, and want to adjust it, the current software requires deep technical skills that most of us lack.&lt;/p&gt;\n&lt;p&gt;Ara helps to adjust the software that is interconnected to each other. Which means we can compose multiple software into something new. Ara also helps to discover and publish your ideas with other people. In other words, Ara makes all software interconnected, composable, and adjustable by any user with minimum technical skill.&lt;/p&gt;\n&lt;p&gt;Ara tries to work with the existing software rather than build the ecosystem from scratch. Ara consists of three parts.&lt;/p&gt;\n&lt;p&gt;The Meta protocol that makes apps self-explaining. The app could be written in any language or in any internet topology. However, the software must have an endpoint that describes what it&#39;s doing so that anyone can use it without knowing its API or documentation upfront.&lt;/p&gt;\n&lt;p&gt;The second component of the Ara is the blockchain-based indexer of all apps worldwide. It also provides a payment system that helps to sort the programs by popularity and rewards the users whose ideas are used by others for profit.&lt;/p&gt;\n&lt;p&gt;The last part of the Ara is the client. The client helps modify, publish, collaborate, or discover software on the internet. The client comes with an AI assistant that understands the meta protocol.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;p&gt;When a remixed version of the music becomes more popular than the original song, it&#39;s fair to share the reward both for DJ and composer.&lt;/p&gt;\n&lt;p&gt;In the same way if a user creates a variant of the software, and commercializes it, then we want to reward the original authors too. It&#39;s a matter of ethics not legal rights. &lt;/p&gt;\n&lt;p&gt;In today&#39;s IT economy is like that. The unknown people dedicate their time to build an open-source software. Then, commercial companies build the software and become billionaire. With the ara we want to reward the open-source developers too.&lt;/p&gt;\n&lt;p&gt;We want to make the economical model in a fair way. By fairness I mean, when an entrepreneur thinks of the commercial product, he shouldn&#39;t bother himself with the reward sharing, it&#39;s a psychologically implies his product is not his. At the same time, we want open-source software makers to earn a passive income. To solve it, we use the cryptocurrency in our indexer. And advised for all app makers to use the Ara cryptocurrency or backed by it cryptocurrency as the app&#39;s payment.&lt;/p&gt;\n&lt;p&gt;This way, if user pays for the service, then ara makes sure that all other services depending on the service also get the share from the users. Using the crypto currency is advised but not required. Then what are the benefits for the commercial app makers?&lt;/p&gt;\n&lt;p&gt;The indexer is what connects the client and the software with the meta protocol. It&#39;s more like a search engine, app store and DNS together. The most important part of the indexer is the recommendation system. There will be other softwares like the one that commercial app maker is creating, there will be another apps that is built on top of the commercial app. Thus, to make the software discoverable for more users, that software must be higher in the rank. And that ranking is defined using the payments. The higher the app traffic, the more discoverable it is.&lt;/p&gt;\n&lt;p&gt;To prevent commercial apps from purchasing the traffic, we add additional method in our blockchain. Namely, we also look at the user&#39;s activity. The more they use the ara, the diverse is their app pool, the more weight it has in the software ranking. Of course it&#39;s the matter of the change as people constantly finds the weakens. The duty of updating the fairness in the recommendation system relies on the ara organization.&lt;/p&gt;\n&lt;p&gt;Any indexer according to the rule must be open-source. And people may create a fork with better recommendation system. Thus, if the ara foundation makes something wrong, there are always people who can instantly replicate and create the better version. In short, there is no any final authoritive, everyone is replacable.&lt;/p&gt;\n&lt;p&gt; &lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;ara-leading-ideas&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Ara leading ideas&quot;],&quot;description&quot;:[0,&quot;My father wanted me to be an architect. He would bring 3ds Max, Photoshop and books that teaches those softwares. In Turkmenistan, architects earn a lot, and well respected in the society. And since childhood I was into the art, my father wanted me to&amp;hellip;&quot;],&quot;date&quot;:[3,&quot;2024-01-15T01:17:04.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;project&quot;],[0,&quot;persona&quot;],[0,&quot;people&quot;],[0,&quot;me&quot;],[0,&quot;ara&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;My father wanted me to be an architect. He would bring 3ds Max, Photoshop and books that teaches those softwares. In Turkmenistan, architects earn a lot, and well respected in the society. And since childhood I was into the art, my father wanted me to be architect and be respected in the society.&lt;/p&gt;\n&lt;p&gt;But I didn&#39;t want to be an architect. My curiousity led me to learn how computers work. It was in late 2000s. Turkmenistan just opened the Internet for mass. But it was a mobile internet. Slow and very expensive. I didn&#39;t have access to the video courses. To read the web articles as it was expensive for the internet traffic.&lt;/p&gt;\n&lt;p&gt;I also didn&#39;t know English very well. In my situation, the books with the smallest size (.djvu, .pdf) that covers topic in depth were ideal. &lt;/p&gt;\n&lt;p&gt;So, I would learn programming by downloading books that were 3-6 megabytes in size in Russian language. And it was the books that are outdated. Books that would talk about Microsoft/Open-source wars, about operating systems such as OS 360/1, programming languages such as Cobol, Fortran and how C, C++ were great than them.&lt;/p&gt;\n&lt;p&gt;Besides touching the history, I also grew up with their dream. &lt;/p&gt;\n&lt;p&gt;When I was an intern in 2017, I saw how the company organized an event related to the Cryptocurrencies and Web3. But that made me confused. I knew what was web3 as the semantic web not something as data ownership.&lt;/p&gt;\n&lt;p&gt;I knew AI not as the deep learning, but as the expert systems. I knew Steve Jobs not because of Iphone, but from 80s in their war with Microsoft.&lt;/p&gt;\n&lt;p&gt;I was learning programming to earn a passive income. After every project, I learnt something new. About design, UX, market research, team work and so on. The lesson that I took is that, writing the app is just 25% of the work. Another 25% of the work is dedicated for the maintaining the app, another 25% for the markeeting, another 25% for the business operations, UI, and so on.&lt;/p&gt;\n&lt;p&gt;Eventually Entrepreneurship start to drain me. I start to look for the purpose of the life. What is the meaning of the life? One of the books said to me, combine what you are good at and what do you want to do since you were a child. I wanted to write stories. I knew art and programming. Combining them together led me to start working in the game industry.&lt;/p&gt;\n&lt;p&gt;The Ara is a result of my experience: learning design tools before programming, game engines, crypto, open-source and dream of early computer pioneers with what I grew up with.&lt;/p&gt;\n&lt;p&gt;When I moved to China I got an unlimited internet traffic with WiFi. I tried video tutorials. But eventually inclined to the fundamental works. They are dry but covers the topics in a systematic way. My questions about purpose, who am I also led to the interest in the history, religion. But even then, I could get with the monographs rather than reading articles of the science popularizers.&lt;/p&gt;\n&lt;p&gt;And until when I was 25, I was going with what books were telling me, as they are smarter than me. Only in 2020s I start to get my own opinion and build my own philosophy. Still, my teachers are respected by me.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;archived-projects&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Archived projects&quot;],&quot;description&quot;:[0,&quot;WaiMaiPay&quot;],&quot;date&quot;:[3,&quot;2023-12-21T11:14:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;project&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;WaiMaiPay&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Demo: &lt;a href=\&quot;https://github.com/ahmetson/wai-mai-pai\&quot;&gt;https://github.com/ahmetson/wai-mai-pai&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Backend Source Code: &lt;a href=\&quot;https://github.com/ahmetson/api-wmp\&quot;&gt;https://github.com/ahmetson/api-wmp&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;msg msg--warning\&quot;&gt;This was the project I was working on in 2017.&lt;/p&gt;&lt;p&gt;WaiMaiPay is a delivery man&#39;s app that notifies the clients as it gets closer. Sometimes, people are not checking their smartphones. The delivery guy using it should call the customer. WaiMaiPay calls the clients as delivery guy is closer.&lt;/p&gt;&lt;p&gt;It tracks the distance by GPS.&lt;/p&gt;&lt;hr /&gt;&lt;p&gt;&lt;a href=\&quot;https://github.com/ahmetson/smartcontract-practice\&quot;&gt;https://github.com/ahmetson/smartcontract-practice&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;msg msg--warning\&quot;&gt;A side project I tried to make for the interns&lt;/p&gt;&lt;p&gt;Learn by creating real projects.&lt;/p&gt;&lt;hr /&gt;&lt;p&gt;Blockchain part: &lt;a href=\&quot;https://github.com/ahmetson/element-words-smartcontracts\&quot;&gt;https://github.com/ahmetson/element-words-smartcontracts&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Game: &lt;a href=\&quot;https://github.com/ahmetson/element-words\&quot;&gt;https://github.com/ahmetson/element-words&lt;/a&gt;&lt;/p&gt;&lt;p&gt;A demo for the Neo hackathon.&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://www.youtube.com/watch?v=hVdgSr93qtg\&quot;&gt;https://www.youtube.com/watch?v=hVdgSr93qtg&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://www.youtube.com/watch?v=YGLvEwzZU5c\&quot;&gt;https://www.youtube.com/watch?v=YGLvEwzZU5c&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;axie-infinity-axs&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Axie Infinity (AXS)&quot;],&quot;description&quot;:[0,&quot;14 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:47:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&q =\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;https://dfsocial.com/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;It aims to bring together the services of decentralized finance protocols and gaming. Long-term vision is a gaming platform with a mobile app, so holders can earn gaming rewards.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;blockchain-game-waxe-waxe&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Blockchain Game: Waxe (WAXE)&quot;],&quot;description&quot;:[0,&quot;14 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:26:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;blockchain&quot;],[0,&quot;blockchain-review&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;14 May 2021&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://waxe.io/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Waxe.io&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Most convenient way to create, buy, sell, and trade virtual items to anyone, anywhere in the world.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;game-para-para&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Game: Para-para&quot;],&quot;description&quot;:[0,&quot;https://ahmetson.github.io/para-para/&quot;],&quot;date&quot;:[3,&quot;2023-12-21T11:26:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;game&quot;],[0,&quot;project&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;https://ahmetson.github.io/para-para/\&quot;&gt;https://ahmetson.github.io/para-para/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;A demo of the para para. A new gameplay for the match 3.&lt;/p&gt;&lt;p&gt;Match the elements and collect the chemical elements faster than the opponent. Prevent the opponent from containing his chemical elements if he is closer.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;conspect-scavenge-blockchain-game-created-with-cosmos-sdk&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Conspect: Scavenge - blockchain game created with Cosmos SDK&quot;],&quot;description&quot;:[0,&quot;15 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:52:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;blockchain&quot;],[0,&quot;blockchain-conspect&quot;],[0,&quot;cosmos-sdk&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;15 May 2021&lt;/em&gt;&lt;/p&gt;&lt;p&gt;Terrible tutorial. A lot of things are not clear. Now, I have to deep diving into the code itself. This tutorial is helpful to get a boilerplate.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;game-serdar&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Game: Serdar&quot;],&quot;description&quot;:[0,&quot;Demo: https://github.com/ahmetson/serdar&quot;],&quot;date&quot;:[3,&quot;2023-12-21T11:21:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;game&quot;],[0,&quot;project&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;Demo: &lt;a href=\&quot;https://github.com/ahmetson/serdar\&quot;&gt;https://github.com/ahmetson/serdar&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Source Code: &lt;a href=\&quot;https://github.com/ahmetson/serdar-source\&quot;&gt;https://github.com/ahmetson/serdar-source&lt;/a&gt;&lt;/p&gt;&lt;p&gt;A mobile educational game that teaches math.&amp;nbsp;&lt;/p&gt;&lt;h2&gt;Story&lt;/h2&gt;&lt;p&gt;There was a Turkmen village under the mountains. An ally of the town called out for a defense as all men went to the rescue.&lt;/p&gt;&lt;p&gt;Another village belonged to the wealthiest man in the world. He loved the daughter of the Chief. But the village Chief&#39;s daughter didn&#39;t respond to the richest man&#39;s love.&amp;nbsp;&lt;/p&gt;&lt;p&gt;When all the men left the village, the world&#39;s richest man attached the village to take the girl by force.&lt;/p&gt;&lt;p&gt;The village sent a message to the men. A group of men led by Serdar returned to the town as soon as possible.&lt;/p&gt;&lt;p&gt;The wealthiest man mercenaries to block the Serdar while catching the village with his force.&lt;/p&gt;&lt;h2&gt;Gameplay&lt;/h2&gt;&lt;p&gt;To not spend his time, help Serdar to choose the right path from multiple routes.&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;gone-projects&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Gone projects&quot;],&quot;description&quot;:[0,&quot;Zytara Dollar (ZUSD) - 14 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:33:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;blockchain&quot;],[0,&quot;blockchain-review&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;Zytara Dollar (ZUSD) - 14 May 2021&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;It&#39;s a stablecoin created by Zytara Capital and issued by Prime Trust, a Nevada-based chartered trust company.&lt;/p&gt;&lt;hr /&gt;&lt;p&gt;&lt;strong&gt;Pteria (PTERIA) - 14 May 2021&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;A governance token for DAO. This token is designed to be used by third-party DAOs as a functional utility token to allocate tokens to&amp;nbsp;new projects.&lt;/p&gt;&lt;hr /&gt;&lt;p&gt;&lt;strong&gt;Playkey (PKT) - 14 May 2021&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Cloud gaming platform on crypto profitable for everyone&lt;/p&gt;&lt;hr /&gt;&lt;p&gt;&lt;strong&gt;IQeon (IQN) - 14 May 2021&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;IQeon.com is the first p2p platform to support IQN digital asset transactions. Users can participate in the games and monetize their in-game achievements using IQN.&lt;/p&gt;&lt;hr /&gt;&lt;p&gt;&lt;strong&gt;Atari Token (ATRI) - 14 May 2021&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Plan to become a universal means of payment for the game industry. Atari Chain LTD designed it.&lt;/p&gt;&lt;hr /&gt;&lt;p&gt;&lt;strong&gt;Lotto Finance (LOTTO) - 14 May 2021&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Automatically enters all holders into a lottery once in a day.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;israel-vs-hamas-peaceful-solution&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Israel vs Hamas: peaceful solution&quot;],&quot;description&quot;:[0,&quot;The 7th October 2023 event is a terrific event that occurred in Israel.&quot;],&quot;date&quot;:[3,&quot;2023-12-21T10:31:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;israel&quot;],[0,&quot;palestine&quot;],[0,&quot;people&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;The 7th October 2023 event is a terrific event that occurred in Israel.&lt;/p&gt;&lt;p&gt;What I want is for Israelis to show mercy for this. Because the politics that Hamas is playing versus what Israel is playing are on the different level.&lt;/p&gt;&lt;p&gt;Israel is more powerful than the established, prosperous nuclear power supported by the collective West, especially by the USA.&lt;/p&gt;&lt;p&gt;To have a piece, we should have mercy. What I despise is that Israel is pretending to be merciful because mercy is not a punishment but forgiveness. Where is the mercy in the warnings when they want to punish Palestinians anyway?&lt;/p&gt;&lt;p&gt;Another thing I despise in the politics of Israel is playing the victim when they are the aggressor against Palestinians.&lt;/p&gt;&lt;p&gt;What is the real mercy is when in Africa, white people were ruling over the black people, some black people uprised against them. They used all methods to be heard—mainly bombing near the schools.&lt;/p&gt;&lt;p&gt;Eventually, they took the victory and brought justice to the black people by giving them the same rights as white people. Nelson Mandela, the leader of this uprising, was named Person of the Year. He is respected by the West, which didn&#39;t focus too much on his bombings.&lt;/p&gt;&lt;p&gt;What is the solution for Israel giving up half of the land to the Palestinians? To avoid revenge and hatred from their side, Israel, as the wealthiest country, could compensate with money by helping to build Palestine by modernizing it.&lt;/p&gt;&lt;p&gt;Rather than spending much on the military budget, they could pay more on building Palestine. Jews would not be richer and have a comfortable life as today, but in return, they would get peace, and they wouldn&#39;t have to fear danger behind the border.&lt;/p&gt;&lt;hr /&gt;&lt;p&gt;When a girl X breaks up with a boyfriend and feels a massive hatred in her heart, she casts on porn or goes to a club to have nights with dozens of people. You can&#39;t have mercy on such kind of people too much.&lt;/p&gt;&lt;p&gt;When girl Y is sent to trade her body at age 15 by her alcoholic parents, the girl is doing the same bad, unjustified things as girl X. But you should have mercy on&amp;nbsp;girl Y because of the conditions that created it.&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;manva-chat&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Manva Chat&quot;],&quot;description&quot;:[0,&quot;Chats https://topai.tools/s/anime-character-chatbot https://kajiwoto.ai/ https://goatchat.ai/chat/animeai GoatChat talks to the anime character. https://neuralcanvas.io/ Create Photorealistic Comics Series with AI https://www.fotor.com/features/ai-comic-generator/ Create and visualize your stories into captivating comics using Fotor’s AI comic generator. Let AI revolutionize the way you create comics and enjoy the innovatively fast and&amp;hellip;&quot;],&quot;date&quot;:[3,&quot;2023-12-26T11:20:58.000Z&quot;],&quot;a f8e&lt;/a&gt;&lt;/div&gt;\n&lt;div&gt; &lt;/div&gt;\n&lt;div&gt;Comic bot made with chat gpt&lt;/div&gt;\n&lt;div&gt; &lt;/div&gt;\n&lt;div&gt; &lt;/div&gt;\n&lt;div&gt;&lt;a href=\&quot;https://aicontentfy.com/en/blog/chatgpt-and-potential-for-creating-ai-generated-web-comics\&quot;&gt;https://aicontentfy.com/en/blog/chatgpt-and-potential-for-creating-ai-generated-web-comics&lt;/a&gt;&lt;/div&gt;\n&lt;div&gt;Potential of chats&lt;/div&gt;\n&lt;div&gt; &lt;/div&gt;\n&lt;div&gt; &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;my-neighbor-alice-alice&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;My Neighbor Alice (ALICE)&quot;],&quot;description&quot;:[0,&quot;14 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:48:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;blockchain&quot;],[0,&quot;blockchain-review&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;14 May 2021&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://www.myneighboralice.com/\&quot;&gt;https://www.myneighboralice.com/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;It is a multiplayer game where anyone can buy and own virtual islands, collect and build exciting items, and meet new friends.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;notes-on-practical-deep-learning-for-coders&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Notes on \&quot;Practical Deep Learning for Coders\&quot;&quot;],&quot;description&quot;:[0,&quot;31 October 2023&quot;],&quot;date&quot;:[3,&quot;2023-12-21T09:38:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;ai&quot;],[0,&quot;ai-notes&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;31 October 2023&lt;/em&gt;&lt;/p&gt;&lt;p class=\&quot;msg msg--info\&quot;&gt;Course: &lt;a href=\&quot;https://course.fast.ai/\&quot;&gt;https://course.fast.ai/&lt;/a&gt;&lt;/p&gt;&lt;p class=\&quot;msg msg--info\&quot;&gt;Book: &lt;a href=\&quot;https://github.com/fastai/fastbook\&quot;&gt;https://github.com/fastai/fastbook&lt;/a&gt;&lt;/p&gt;&lt;h2&gt;Intro&lt;/h2&gt;&lt;p&gt;Deep Learning is a computer technique to extract and transform data using multiple neural network layers.&lt;/p&gt;&lt;p&gt;Top used use cases:&lt;/p&gt;&lt;ol&gt;&lt;li&gt;NLP: answer questions; speech recognition; summarize; classify; find; search&lt;/li&gt;&lt;li&gt;Computer Vision: satellite image interpretation, face recognition, caption&lt;/li&gt;&lt;li&gt;Medicine: finding anomalies; counting features in slides; measuring; diagnosing&lt;/li&gt;&lt;li&gt;Biology: classifying genomic tasks; analyzing cell interactions&lt;/li&gt;&lt;li&gt;Image Generation&lt;/li&gt;&lt;li&gt;Recommend Systems: search engines, home page layout, product recommendation&lt;/li&gt;&lt;li&gt;Playing Games&lt;/li&gt;&lt;li&gt;Robotics&lt;/li&gt;&lt;li&gt;Financial, Logistics, etc...&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;In 1943, Warren McCulloch and Walter Pitts developed a mathematical model of artificial neurons. It&#39;s declared in \&quot;&lt;em&gt;A logical calculus of the ideas immanent in Neurous Activity&lt;/em&gt;.\&quot;&lt;/p&gt;&lt;p&gt;The neuron could be represented as addition and thresholding.&lt;/p&gt;&lt;figure class=\&quot;align-center\&quot;&gt;&lt;img loading=\&quot;lazy\&quot; src=\&quot;https://www.researchgate.net/publication/258372123/figure/fig1/AS:374245319299072@1466238445241/Mathematical-model-of-artificial-neuron.png\&quot; alt=\&quot;Mathematical model of artificial neuron | Download Scientific Diagram\&quot; width=\&quot;239\&quot; height=\&quot;166\&quot; data-is-external-image=\&quot;true\&quot; /&gt;&lt;/figure&gt;&lt;p&gt;Frank Rosenblatt gave artificial neurons the ability to learn. He even created the first device on this principle: &lt;strong&gt;Mark I Perceptron&lt;/strong&gt;.&lt;/p&gt;&lt;blockquote&gt;&lt;p&gt;We are now about to witness the birth of such a machine - capable of perceiving, recognizing, and identifying the surroundings without any human training or context.&lt;/p&gt;&lt;p class=\&quot;align-right\&quot;&gt;\&quot;The Design of an Intelligent Automata\&quot;&lt;/p&gt;&lt;p class=\&quot;align-right\&quot;&gt;Frank Rosenblatt&lt;/p&gt;&lt;/blockquote&gt;&lt;p&gt;Marvin Minsky and Seymour Papert wrote a book called \&quot;&lt;em&gt;Perceptrons&lt;/em&gt;.\&quot; They showed that the device needs multiple layers to learn simple mathematical functions.&lt;/p&gt;&lt;p&gt;Perhaps the most pivotal work in neural networks was the \&quot;&lt;em&gt;Parallel Distributed Processes&lt;/em&gt;\&quot; by David Rumelhart, James McCallen, and the PDP Research Group, released in 1986.&lt;/p&gt;&lt;p&gt;PDP approach for the programming framework defined requires:&lt;/p&gt;&lt;ol&gt;&lt;li&gt;process unit sets&lt;/li&gt;&lt;li&gt;state of activation&lt;/li&gt;&lt;li&gt;output function for each unit&lt;/li&gt;&lt;li&gt;connectivity pattern among units&lt;/li&gt;&lt;li&gt;propagation rule for propagating through the network of connectivities&lt;/li&gt;&lt;li&gt;activation rule for combining inputs impinging on a unit with the current state of that unit to produce output for the unit&lt;/li&gt;&lt;li&gt;learning rule whereby patterns of connectivity are modified by experience&lt;/li&gt;&lt;li&gt;an environment where PDP must operate&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;Modern Neural Networks use an approach similar to PDP.&amp;nbsp;&lt;/p&gt;&lt;p class=\&quot;msg msg--info msg--highlight\&quot;&gt;The book says that the theoretical knowledge was misunderstood, and the issues held back the development until 2010. But also says that despite having two layers, it was too big and too slow to be helpful. Recent advancements in the hardware allowed training neural networks with more layers.&lt;/p&gt;&lt;p class=\&quot;msg msg--info\&quot;&gt;For learning, it is best to use Jupyter Notebooks. The Jupyter Notebooks are software that allows you to include assets and code together.&lt;/p&gt;&lt;p&gt;The deep learning uses the neural networks. It&#39;s part of machine learning. The deep learning model process and its training apply to the general concepts of machine learning.&lt;/p&gt;&lt;p&gt;Machine learning is another form of programming where instead of the algorithm, you write the desired output, and the software finds the path.&lt;/p&gt;&lt;p&gt;The term \&quot;machine learning\&quot; was coined by Arthur Samuel from IBM in 1949. In his 1962 classic essay \&quot;&lt;em&gt;Artificial Intelligence: A Frontier of Automation,&lt;/em&gt;\&quot; he wrote machine technique.&lt;/p&gt;&lt;p&gt;Rather than describing each step to solve the task, show an example of the problem to solve. Then, let the program figure out the algorithm.&lt;/p&gt;&lt;hr /&gt;&lt;p&gt;There is an actual performance of weight assignment. Then, there is an automatic means of testing performance—a mechanism for improving performance by changing weight assignments.&lt;/p&gt;&lt;p&gt;The weights are variables. The weight assignments are a choice of those variables. The program inputs are variables.&amp;nbsp;&lt;/p&gt;&lt;p&gt;In modern terminology, machine learning programs are called models.&lt;/p&gt;&lt;p&gt;The weight assignment is the second input describing the actual input. In modern terminology, weight assignments are called model parameters.&lt;/p&gt;&lt;p&gt;Automatic testing means you let two models work against each other. Actual performance is the desired result. After each iteration, you adjust the model to test the outcome.&lt;/p&gt;&lt;p&gt;If you automate the iteration to adjust the model parameters, the program could learn from experience.&lt;/p&gt;&lt;p&gt;This automatic iteration is called model training.&lt;/p&gt;&lt;p&gt;Once the weights were adjusted, they became part of the model.&amp;nbsp;&lt;/p&gt;&lt;p&gt;The neural networks are mathematical functions. The mathematical proof called the Universal Approximation Theorem shows this function can solve any problem in theory.&lt;/p&gt;&lt;p&gt;The general approach to adjusting weights is made via Stochastic Gradient Descent (SGD), a mathematical method.&lt;/p&gt;&lt;p&gt;The model includes weight, a function producing results, and performance updating weights. The functional part is called architecture.&lt;/p&gt;&lt;p&gt;Prediction is the result. The loss is the measurement of the performance. It&#39;s measured against the labels.&lt;/p&gt;&lt;p&gt;Transformers are code that is applied during the training. There are item and batch transformers. The inputs are not used to train. Some part of the set is kept separated to test that training.&lt;/p&gt;&lt;p&gt;The training input is called a training set, while testing data is used as a validation set. Over time, as the validation set is set, the model starts memorizing the labels. Thus, it doesn&#39;t find the generalizing patterns. This is called overfitting.&lt;/p&gt;&lt;p&gt;Overfitting is the single, most important issue in the model training.&lt;/p&gt;&lt;p&gt;Resnet is one of the architectures. It could have 18, 34, 50, 101 and 150 layers. The more layers mean training and with less data will be prone to overfitting.&lt;/p&gt;&lt;p&gt;The model that has trained weights is called pre-trained model. It&#39;s better to build on the pre-trained models by changing some layers with yours. Using pre-trained model for a task different than what it was originally trained is called transfer learning.&lt;/p&gt;&lt;p&gt;Fine tuning is a transfer learning technique where parameters of pretrained models update by additional epoch. Epoch is how many times the model looks at the data.&lt;/p&gt;&lt;p&gt;Machine learning has some limitations:&lt;/p&gt;&lt;ol style=\&quot;list-style-type: lower-alpha;\&quot;&gt;&lt;li&gt;A model can not be created without data&lt;/li&gt;&lt;li&gt;It can learn the patterns from input data&lt;/li&gt;&lt;/ol&gt;&lt;hr /&gt;&lt;h2&gt;Deep Learning Vocabulary&lt;/h2&gt;&lt;p&gt;Label - a data we are trying to predict&lt;/p&gt;&lt;p&gt;Architecture - a template of a model we are tring to fit a model; an actual function&lt;/p&gt;&lt;p&gt;Parameters - values in model that change what task it can do and updates throughout the training process.&lt;/p&gt;&lt;p&gt;Fit - update the parameters such that predictions of model using input to match output labels. Also called Train.&lt;/p&gt;&lt;p&gt;Fine Tune - special technique in transfer learning to update pre-trained model.&lt;/p&gt;&lt;p&gt;Epoch - one complete task to pass through input data&lt;/p&gt;&lt;p&gt;Loss - a measure how good model is using validation set&lt;/p&gt;&lt;p&gt;Training set - data for training&lt;/p&gt;&lt;p&gt;Validation set - data for measuring loss&lt;/p&gt;&lt;p&gt;Overfitting - training remembers specific features of input than generalizing pattern.&lt;/p&gt;&lt;p&gt;CNN - neural network for computer vision&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;notes-on-practical-deep-learning-foundation&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Notes on &amp;quot;Practical deep learning&amp;quot;: foundation&quot;],&quot;description&quot;:[0,&quot;While trying to launch the model, I discovered the book was outdated. Now, we took video lessons more than the book chapters. These are the notes on Lesson 3: How Neural Networks work and how to optimize it. Run notebooks in the /clean folder from the&amp;hellip;&quot;],&quot;date&quot;:[3,&quot;2023-12-28T15:50:50.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;technology&quot;],[0,&quot;ai-notes&quot;],[0,&quot;ai&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p class=\&quot;msg msg--highlight  msg--warning\&quot;&gt;While trying to launch the model, I discovered the book was outdated. Now, we took video lessons more than the book chapters.&lt;/p&gt;\n&lt;p&gt;These are the notes on Lesson 3: How Neural Networks work and how to optimize it.&lt;/p&gt;\n&lt;h2&gt;How to learn?&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Watch the lessons&lt;/li&gt;\n&lt;li&gt;(Read the chapters)&lt;/li&gt;\n&lt;li&gt;Run notebooks and experiment.&lt;/li&gt;\n&lt;li&gt;Reproduce results&lt;/li&gt;\n&lt;li&gt;Repeat with different dataset&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p class=\&quot;msg--info msg--highlight msg\&quot;&gt;Run notebooks in the &lt;a href=\&quot;https://github.com/fastai/fastbook/tree/master/clean\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;/clean&lt;/a&gt; folder from the book repo.&lt;/p&gt;\n&lt;h2&gt;About exported model&lt;/h2&gt;\n&lt;p&gt;The exported model &#39;.pkl&#39; has two things.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Preprocessing steps to turn data into a model: &lt;code&gt;DataLoader&lt;/code&gt;part.&lt;/li&gt;\n&lt;li&gt;Trained model available in &lt;code&gt;.model&lt;/code&gt;parameter. It&#39;s a tree of multiple models for each neural layer. The submodules are available by &lt;code&gt;model.get_submodule()&lt;/code&gt;method.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p class=\&quot;msg msg--highlight   \&quot;&gt;@interact(a=1, b=2, c=3) is the particular keyword for jupyter to make interactive parameters.&lt;/p&gt;\n&lt;h1&gt;How does Neural Network work?&lt;/h1&gt;\n&lt;p&gt;A neural network tries to fit a function to data. The neural network adjusts the function parameters until the function&#39;s output is not close to the data.&lt;/p&gt;\n&lt;p&gt;After adjusting the parameter, a loss function is used to see how close the function output is to the data. The &lt;code&gt;mean_mean_error: ((output - data)^2).mean()&lt;/code&gt;is the most popular loss function.&lt;/p&gt;\n&lt;p&gt;To automate adjustment by a loss function, we could calculate the derivative. Derivative checks how much parameter value increase increases the output. And how far it is from the data. The distance from the data to the function output is called a &lt;code&gt;slope&lt;/code&gt; or &lt;code&gt;gradient&lt;/code&gt;.&lt;/p&gt;\n&lt;p class=\&quot;msg msg--highlight \&quot;&gt;Python tip: &lt;code&gt;func(*params)&lt;/code&gt;. The * expands the parameters into function arguments as a, b, and c.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;PyTorch&lt;/code&gt; library has built-in derivative calculating functions. This function is called a &lt;code&gt;tensor.backward()&lt;/code&gt;. It&#39;s the method of the tensors.&lt;/p&gt;\n&lt;p&gt;How to enable derivative:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Create a tensor: &lt;code&gt;abc = torch.tensor([1.5, 1.5, 1.5])&lt;/code&gt; . For example, it created a rank one tensor.&lt;/li&gt;\n&lt;li&gt;Enable derivative calculation in the tensor: &lt;code&gt;abs.requires_grad_()&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Calculate loss. Then, calculate a derivative using &lt;code&gt;.backward()&lt;/code&gt;. This function adds the &lt;code&gt;.grad&lt;/code&gt; property to the tensor with the slope derivative.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Once the gradient value is available, we can iterate multiple times by adjusting parameters by the slope number.&lt;/p&gt;\n&lt;p&gt;This loop is called &lt;strong&gt;optimization&lt;/strong&gt;, which means decreasing the loss value.&lt;/p&gt;\n&lt;h2&gt;Example&lt;/h2&gt;\n&lt;p&gt;Assume we have random dots on the graph for the &lt;em&gt;c*x^2 + b*x + a &lt;/em&gt;equation. Let the function find the values for &lt;em&gt;a, b,&lt;/em&gt; and &lt;em&gt;c&lt;/em&gt;. &lt;/p&gt;\n&lt;p&gt;We have multiple dots for each part, not one. Because if there was one dot, we could draw a line by them.&lt;/p&gt;\n&lt;p&gt;Initially, we picked some random numbers as the starting point. Then, we calculate the loss using &lt;code&gt;mean_square_error &lt;/code&gt;by passing random dots and our initial values.&lt;/p&gt;\n&lt;p&gt;Assume that the numbers are converted into tensors with enabled derivatives. Finally, we adjust the values until the gradient doesn&#39;t decrease sufficiently.&lt;/p&gt;\n&lt;h2&gt;ReLu&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;Relu&lt;/strong&gt; is a short name for &lt;strong&gt;Rectified Linear:&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;def rectified_linear(m, b, x):&lt;br /&gt;  y = m * x + b&lt;br /&gt;  return torch.clip(y, 0.)&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;This function is the single function whose negative value is turned into 0.&lt;/p&gt;\n&lt;p&gt;Combining multiple relationships creates a flexible function that can solve almost any problem. &lt;/p&gt;\n&lt;p&gt;This is pretty much the foundation on which all neural networks are built.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;openzeppelin-in-preda-programming-language&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;OpenZeppelin in Preda programming language&quot;],&quot;description&quot;:[0,&quot;This page describes porting the OpenZeppelin contracts into a PREDA model. The OpenZeppelin contracts consist of multiple parts: Library V5, Upgradeable Plugin, and Subgraph. This is the porting of some parts of version 5. The Upgradeable plugin is ported on its own later. The subgraph&amp;hellip;&quot;],&quot;date&quot;:[3,&quot;2023-12-27T09:52:35.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;technology&quot;],[0,&quot;project&quot;],[0,&quot;preda-programming-language&quot;],[0,&quot;blockchain&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;This page describes porting the OpenZeppelin contracts into a PREDA model.&lt;/p&gt;\n&lt;p&gt;The OpenZeppelin contracts consist of multiple parts: &lt;a href=\&quot;https://docs.openzeppelin.com/contracts/5.x/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Library V5&lt;/a&gt;, &lt;a href=\&quot;https://docs.openzeppelin.com/upgrades-plugins/1.x/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Upgradeable Plugin&lt;/a&gt;, and &lt;a href=\&quot;https://docs.openzeppelin.com/subgraphs/0.1.x/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Subgraph&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;This is the porting of some parts of version 5. The Upgradeable plugin is ported on its own later. The subgraph is not ported, as it&#39;s out of the smart contract programming scope.&lt;/p&gt;\n&lt;p&gt;The OpenZeppelin uses semantic versioning to release new changes. This is the porting of the version 5, the latest by the end of 2023.&lt;/p&gt;\n&lt;h2&gt;Parts and what is not ported&lt;/h2&gt;\n&lt;p&gt;The OpenZeppelin smart contracts or utilities around them are grouped into various categories. &lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Wizard - Interactive smartcontract generator.&lt;/li&gt;\n&lt;li&gt;Access Control - utility to limit function calls.&lt;/li&gt;\n&lt;li&gt;Tokens - NFT, Cryptocurrency, etc.&lt;/li&gt;\n&lt;li&gt;Governance - Decentralized Autonomous Organization (DAO) tools.&lt;/li&gt;\n&lt;li&gt;Utils - additional useful smartcontracts to use in your projects: Cryptography, Math, Introspection, and many more.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;We don&#39;t implement a wizard, as it&#39;s out of the smart contract programming scope.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;persian-role-in-seljuk-empire&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Persian role in Seljuk Empire&quot;],&quot;description&quot;:[0,&quot;26 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:15:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;history&quot;],[0,&quot;ideology&quot;],[0,&quot;iranica&quot;],[0,&quot;people&quot;],[0,&quot;seljuk&quot;],[0,&quot;turkmen&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;26 May 2021&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Persian role in the Seljukid empire is vastly overestimated. This bias began with the Western research back in the Oriental Institute during colonial times, which touched only the sedentary part of the state, mainly skipping the role of nomadic Turks.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;As such, they started to claim that the conquest of Anatolia by Turks was the result of Seljuk sultans protecting their sedentary Muslim population. Because it was an Iranian empire of Turkic origin.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Such a sizeable negative view of Turks by Westerners is primarily related to the sources that they were using for it. Both Arabic and Persian scripts were differentiating the ruling dynasty and their kingship. While praising the role of Seljuks in the Islamic political scene, they were highly damaging to the nomadic Turks, often mentioning them as the plunderers of the cities.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;The medieval sources, especially Persian ones, in neglecting the view of Turks, are criticized by Edmund Bosworth. He mentioned that writing Turkish titles and names in scripts is largely hard to read, as those people were not interested in them. As such, it is hard to differentiate the characters from titles of Turks.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Cambridge History of Iran also mentions it. That starts to criticize the “persianate” face of the state. Or the idea that Anatolia is a little Persia (It also goes against the thesis that Seljuks pushed Turkmens from Iran to Anatolia to avoid the sedentarization; why do Seljuks come to Anatolia themselves, bringing Persians then follow after Turkmens).&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Seljuks, in fact, were not Persiniate as people think, as, for example, by 1100, the Tughril ibn MalikShah was still living in the tents, not in the cities. Their titles and institutions, such as Khatun or Atabeg, are still borrowed from the old Oghuz Yabgu state and used in the Seljuk Empire.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;As a political power, Seljuks were using the Turkish nomadic emblem Tughra (a double head bird), which also shows that they were keeping their nomadic culture strongly.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Seljuk&#39;s political ideology was based mainly on the Nomadic tradition, not on the Iranian tradition. Unlike the Persian tradition, where it tends to have a single authority, nomads declare the power as the belonging of the clan, where the elder is ruling as the leader. This Nomadic tradition was still alive, as besides the significant branch of Seljuks, we also had several branches living in various areas (Seljuks of Rum, Seljuks of Syria, Seljuks of Iraq, Seljuks of Kerman).&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;The last of the Great Seljukids, Sultan Sanjar, also used this Turkmen tradition to legitimate his power over his young nephew Muhammad as the head of the Great Seljuks.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;This concludes that the Seljuk Empire was an empire of Muslim dwellers and a nomadic empire.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Using the Tughra, Turkish titles in the state, and following Turkmens till Anatolia brings us to the role of nomads. Seljuks, for rising to power, were obligated to Oghuz-Turkmen nomads. As such, in the Seljuk empire, they played a unique role. Their role was also mentioned by Nizam al-Mulk in his Siyasat-name to remember the role of Turkmens and act with them with special care. It is also mentioned in the book dedicated to Sultan Sanjar by the grandson of Nizam al Mulk, as in the bachelor letters of Sanjar translated by David Durand.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;With such a particular role&amp;nbsp;that none of the other ethnic groups in the empire had, we can conclude that the&amp;nbsp;empire was a Turkmen empire.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;P.S. When Seljuks removed the special status of Turkmens by listening to their Ghulams and Persian viziers, Turkmens&#39; status was revoked, which was the primary factor in the decline of the Seljuk empire.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;br /&gt;&lt;br /&gt;&lt;br /&gt;&lt;br /&gt;&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;notes-on-practical-deep-learning-launching&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Notes on \&quot;Practical deep learning\&quot;: launching&quot;],&quot;description&quot;:[0,&quot;Start with the objective when designing your model.&quot;],&quot;date&quot;:[3,&quot;2023-12-22T09:41:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;ai&quot;],[0,&quot;ai-notes&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;h2&gt;Chapter 2: Production&lt;/h2&gt;&lt;p&gt;Start with the objective when designing your model.&lt;/p&gt;&lt;p&gt;For example, Google started with the objective: \&quot;&lt;em&gt;&lt;span style=\&quot;text-decoration: underline;\&quot;&gt;What is the user&#39;s main objective in typing in a search query?&lt;/span&gt;&lt;/em&gt;\&quot; This led to the aim to \&quot;&lt;span style=\&quot;text-decoration: underline;\&quot;&gt;&lt;em&gt;show the most relevant search result.&lt;/em&gt;&lt;/span&gt;\&quot;&lt;/p&gt;&lt;p&gt;The next step is to determine what actions you can take to achieve the objective. In Google&#39;s case, it was ranking search results.&lt;/p&gt;&lt;p&gt;The third step is determining what new data you need for the actions. In Google&#39;s case, what new data would they need to produce such a ranking?&lt;/p&gt;&lt;p&gt;They realized that the implicit information regarding which pages linked to which other page could be useful for this purpose.&lt;/p&gt;&lt;p&gt;We begin thinking about building a predictive model after these three steps. The objective, levers, the data we have, and the data we need determine the model we make. The models will take the levers and uncontrollable variables as their inputs; the output can be combined to predict the final state of the objective.&lt;/p&gt;&lt;h3&gt;Recap by answering the questions&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;If the images for the bear classifier are from the game, then the app won&#39;t work because it was trained with the photo of the real bears.&lt;/li&gt;&lt;li&gt;The text models cannot understand the semantics. This could lead to incorrect predictions.&lt;/li&gt;&lt;li&gt;Text models could be used to troll the internet to spread disinformation.&lt;/li&gt;&lt;li&gt;Usage of AI doesn&#39;t guarantee 100% results. It&#39;s especially critical with the medical reports. One solution is to work en-par with the people. The highly predictive outputs could be automated. For less predicted outcomes, we can do a manual check.&lt;/li&gt;&lt;li&gt;The AI is good at high cardinality tabular data. The high cardinality means it&#39;s something that contains ample discrete choices.&lt;/li&gt;&lt;li&gt;The recommendation systems work with user-generated behaviors. It recommends similar products from other sales. But it doesn&#39;t mean users didn&#39;t see them or may want something others didn&#39;t pick yet.&lt;/li&gt;&lt;li&gt;Drivetrain approach: a) define an objective. b) define actions to reach the objective. c) define the data you need for the actions.&lt;/li&gt;&lt;li&gt;Drivetrain approach for the video recommendation system: a) keep users in the platform. b) find liked videos like this from people of similar taste. c) create a data of liked data.&lt;/li&gt;&lt;li&gt;The DataLoader class prepares data for training from unprepared data.&lt;/li&gt;&lt;li&gt;To create a DataLoader, we need four things: a) What kind of data are we working with: images and text? b) How do you get those data: from files, CSV, or SQL? c) How do you label the items by filename? d) How to create a validation set: split items randomly by a seed.&lt;/li&gt;&lt;li&gt;The splitter parameter of DataLoader describes how to get the validation set from the items list.&lt;/li&gt;&lt;li&gt;The splitter takes two arguments: the percentage of items in the validation set and a seed to generate a random list.&lt;/li&gt;&lt;li&gt;To determine independent variables, we use X. To represent dependent variables, we use Y.&lt;/li&gt;&lt;li&gt;When images have different sizes, we need to normalize them—crop, pad, or squish.&lt;/li&gt;&lt;li&gt;Data augmentation creates variants of the item by applying transforming functions. It helps to increase the amount of training set.&lt;/li&gt;&lt;li&gt;Item transformers apply a function to each data. Batch transformers use the function of a whole batch.&lt;/li&gt;&lt;li&gt;The confusion matrix shows a table of the training results. It helps to debug the data we used for training.&lt;/li&gt;&lt;li&gt;The export function saves the architecture and model parameters together.&lt;/li&gt;&lt;li&gt;To use a prediction model instead for training is called inference.&lt;/li&gt;&lt;li&gt;IPython widgets are GUI components combining JavaScript and Python codes.&lt;/li&gt;&lt;li&gt;we may use CPU in production since we work with one item at a time. In training, we may use GPU to accelerate the process.&lt;/li&gt;&lt;li&gt;If a model is on a server, then there is a risk of working with&amp;nbsp;confidential user data. Or network latency may slow down the prediction.&lt;/li&gt;&lt;li&gt;the camera might capture the bears from different angles for a bear classifier, but it didn&#39;t work with the night vision. The camera may have low resolution.&lt;/li&gt;&lt;li&gt;Out of domain is when an image for inference is not in a category of images we used for training.&lt;/li&gt;&lt;li&gt;The domain shift is when the type of data changes over time.&lt;/li&gt;&lt;li&gt;Three deployment process steps: a) export model for inference. b) create a UI. c) host the model.&lt;/li&gt;&lt;/ol&gt;&lt;hr /&gt;&lt;p&gt;Objective: Understand the text in depth. Users should not be distracted.&lt;/p&gt;&lt;p&gt;Action: Track all words users encounter.&lt;/p&gt;&lt;p&gt;Then, get the description and insert it into the context. If it&#39;s a link, get a summary and add it.&amp;nbsp;&lt;/p&gt;&lt;p&gt;Data: track all words the user knows. Track how often he read and keep the terminology until it won&#39;t increase in appearance.&lt;/p&gt;&lt;p&gt;What should happen if it went out? Everyone on the internet uses it.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;phantasma-soul&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Phantasma (SOUL)&quot;],&quot;description&quot;:[0,&quot;14 May 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T08:40:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;blockchain&quot;],[0,&quot;blockchain-review&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;&lt;em&gt;14 May 2021&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://phantasma.io/\&quot;&gt;https://phantasma.io/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Fast, secure, and scalable blockchain solution that allows developers to build decentralized applications and facilitates interoperability with other blockchains while maintaining a decentralized governance system.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;programming-language-preda&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Programming Language: Preda&quot;],&quot;description&quot;:[0,&quot;In the middle of 2023, I joined a Preda hackathon that kicked out on 18th November 2023. I already have an interest in programming languages. So, I will use this hackathon to try out a new language. But what is Preda programming language? Official website:&amp;hellip;&quot;],&quot;date&quot;:[3,&quot;2023-12-27T09:11:43.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;technology&quot;],[0,&quot;programming-language&quot;],[0,&quot;preda-programming-language&quot;],[0,&quot;blockchain-conspect&quot;],[0,&quot;blockchain&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;In the middle of 2023, I joined a Preda hackathon that kicked out on 18th November 2023.&lt;/p&gt;\n&lt;p&gt;I already have an interest in programming languages. So, I will use this hackathon to try out a new language. But what is Preda programming language?&lt;/p&gt;\n&lt;h1&gt;The Language Specification&lt;/h1&gt;\n&lt;p&gt;Official website: &lt;a href=\&quot;https://www.preda-lang.org/pdf/preda-model-sole.pdf\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;https://www.preda-lang.org/&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Preda is a programming language used to increase transaction throughput for applications on blockchain platforms.&lt;/p&gt;\n&lt;h2&gt;Preface&lt;/h2&gt;\n&lt;p&gt;The applications in the blockchain platforms are called smartcontracts. Ethereum invented intelligent contracts, the first blockchain platform, in 2015.&lt;/p&gt;\n&lt;p&gt;Even in 2023, Ethereum is the most popular blockchain platform, setting the global trends in the cryptocurrency ecosystem. The Ethereum blockchain network has the Ethereum Virtual Machine (EVM), where smart contracts are executed. The platform provides various programming languages to write a smartcontract targeting EVM.&lt;/p&gt;\n&lt;p&gt;The most popular programming language is Solidity: &lt;a href=\&quot;https://soliditylang.org/\&quot;&gt;https://soliditylang.org/&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;However, EVM could process a single transaction simultaneously, which means a considerable delay during the high traffic.&lt;/p&gt;\n&lt;p&gt;There are many ways to solve the scalability issues. Most of the blockchain trend goes into building a blockchain of blockchains: Cosmos, Polkadot, Layer 2 blockchains, etc.&lt;/p&gt;\n&lt;p&gt;Preda is taking an unusual direction to increase scalability by creating distributed intelligent contracts.&lt;/p&gt;\n&lt;h2&gt;Distributed Smartcontracts&lt;/h2&gt;\n&lt;p&gt; To understand a distributed smartcontract, think about a popular web application. Imagine a web application that serves thousands of requests at a time. How would you scale the server to serve multiple requests?&lt;/p&gt;\n&lt;p&gt;The intuitive way to execute multiple requests simultaneously is by creating multiple copies of the application (as a cluster) that run the requests in parallel. But there is a better approach. You could split the app into smaller inter-connected parts rather than creating a copy of the same code. Then, create a cluster of the parts that have a heavy load. When an app consists of multiple inter-connected parts running in parallel, this app is called a distributed application.&lt;/p&gt;\n&lt;p&gt;Almost all modern web applications are distributed with at least a client, server, and database.&lt;/p&gt;\n&lt;p&gt;Similarly, a distributed smart contract consists of multiple parts that execute the transactions together.&lt;/p&gt;\n&lt;p&gt;As I mentioned in the Preface, the current EVM supports a single transaction simultaneously. So, Solidity is created for a single transaction as well.&lt;/p&gt;\n&lt;p&gt;To create distributed intelligent contracts, we need a blockchain that supports distributed systems and a programming language to execute and make asynchronous calls between various allocated parts.&lt;/p&gt;\n&lt;p&gt;Even in modern EVM, you can split an app into multiple intelligent contracts. But their interaction is synchronous, so it blocks all requests until other smart contracts won&#39;t complete the execution.&lt;/p&gt;\n&lt;p&gt;Contract A could send request A to contract B by making the requests asynchronous. Meanwhile, execute the request B from the transaction pools.&lt;/p&gt;\n&lt;p&gt;Preda is the programming language used to make asynchronous calls between smart contracts, which solves the second problem for scalable execution.&lt;/p&gt;\n&lt;figure class=\&quot;post__image\&quot;&gt;&lt;img loading=\&quot;lazy\&quot;  src=\&quot;https://dioxide.network/img/model-2.png\&quot; alt=\&quot;\&quot; width=\&quot;959\&quot; height=\&quot;605\&quot; data-is-external-image=\&quot;true\&quot; /&gt;&lt;/figure&gt;\n&lt;p&gt;&lt;em&gt;From dioxide.network&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;But why was Preda invented?&lt;/p&gt;\n&lt;p&gt;This is a Smartcontract.&lt;/p&gt;\n&lt;h2&gt;Motivation behind Preda&lt;/h2&gt;\n&lt;p&gt;As in most aspects of social interactions, the top 1% of the services get the majority of the traffic. So, scalability is needed for them.&lt;/p&gt;\n&lt;figure class=\&quot;post__image\&quot;&gt;&lt;img loading=\&quot;lazy\&quot;  src=\&quot;/media/posts/30/top-20-gas-consuming-smart-contracts-30d.png\&quot; alt=\&quot;\&quot; width=\&quot;2401\&quot; height=\&quot;1260\&quot; sizes=\&quot;100vw\&quot; srcset=\&quot;/media/posts/30/responsive/top-20-gas-consuming-smart-contracts-30d-xs.png 300w ,/media/posts/30/responsive/top-20-gas-consuming-smart-contracts-30d-sm.png 480w ,/media/posts/30/responsive/top-20-gas-consuming-smart-contracts-30d-md.png 768w ,/media/posts/30/responsive/top-20-gas-consuming-smart-contracts-30d-lg.png 1024w ,/media/posts/30/responsive/top-20-gas-consuming-smart-contracts-30d-xl.png 1360w ,/media/posts/30/responsive/top-20-gas-consuming-smart-contracts-30d-2xl.png 1600w\&quot; /&gt;&lt;/figure&gt;\n&lt;p&gt;Source: &lt;a href=\&quot;https://www.theblock.co/data/on-chain-metrics/ethereum/top-20-gas-consuming-smart-contracts-30d\&quot;&gt;https://www.theblock.co/data/on-chain-metrics/ethereum/top-20-gas-consuming-smart-contracts-30d&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Just look at Uniswap, which has about the 18th transactions, while Scroll has 2 thousand transactions. All other two million transactions deployed on Ethereum get less than 2000 transactions.&lt;/p&gt;\n&lt;h2&gt;Notes on specification&lt;/h2&gt;\n&lt;p&gt;Preda is a new programming language that extends Solidity by adding asynchronous calls between intelligent contracts.&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;To support such kinds of smart contracts, the Preda team also created a blockchain network for that: &lt;a href=\&quot;https://dioxide.network/\&quot;&gt;https://dioxide.network/&lt;/a&gt;&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;The Preda programming language specification Old: &lt;a href=\&quot;https://www.preda-lang.org/pdf/preda-model-sole.pdf\&quot;&gt;https://www.preda-lang.org/pdf/preda-model-sole.pdf&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;The Preda programming language specification: &lt;a href=\&quot;https://preda-lang.org/pdf/PREDA_Model_as_an_Experimental_New_Smart_Contract_Language.pdf\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;https://preda-lang.org/pdf/PREDA_Model_as_an_Experimental_New_Smart_Contract_Language.pdf&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Here are the notes I took by highlighting the critical parts of Preda.&lt;/p&gt;\n&lt;p&gt;Preda stands for &lt;strong&gt;P&lt;/strong&gt;arallel &lt;strong&gt;R&lt;/strong&gt;elay &lt;strong&gt;E&lt;/strong&gt;xecution &lt;strong&gt;D&lt;/strong&gt;istributed &lt;strong&gt;A&lt;/strong&gt;rchitecture. Preda introduces two models:&lt;/p&gt;\n&lt;ul style=\&quot;list-style-type: circle;\&quot;&gt;\n&lt;li&gt;Programmable Scope: an isolated state of the smartcontract. Define the scope by data access pattern, which narrows and minimizes the data dependency between the states.&lt;/li&gt;\n&lt;li&gt;Asynchronous Function Relay: a transaction logic that moves execution from one programmable scope to another. The function relay is defined with the explicit data dependency.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In Solidity on Ethereum, the smartcontracts are defined as a set of variables (state) and functions (transaction functions). The state and functions are described in the global scope. However, it presents two significant challenges in scaling intelligent contracts.&lt;/p&gt;\n&lt;p&gt;1. Partitioning the state requires understanding the data access patterns associated with the state variables. The Preda solves it by introducing a Programmable Contract Scope (κ-scope).&lt;/p&gt;\n&lt;p&gt;2. A function defined on a global scope requires the availability of all functions and state variables. The Asynchronous Functional Relay (λ-relay) narrows the scope for a function to execute. The λ-relay decomposes the execution of k-scopes in the order of data dependency.&lt;/p&gt;\n&lt;p&gt;In Preda, when invoking a function, it must provide a &lt;em&gt;target k-scope&lt;/em&gt;, an analogy &#39;&lt;em&gt;this&lt;/em&gt;&#39; pointer in C++.&lt;/p&gt;\n&lt;h3&gt;Special k-Scopes&lt;/h3&gt;\n&lt;p&gt;Engine Scopes = φθ(i): one instance of k-scope built in for each instance of the execution engine to represent a scope available for immediate read/write by any function executing the current execution engine. The engine scope is not allowed to be the target of λ-relay nor be referred to by specifying θ(i). The variables and functions in the engine scope can be accessed only by the i-th engine.&lt;/p&gt;\n&lt;p&gt;Global Scopes =  φΩ: a built-in k-scope that logically singletones the entire network.&lt;/p&gt;\n&lt;p&gt;PREDA model strictly prohibits referring to a specific instance of an execution engine or making assumptions on the underlying configuration (for example,&lt;em&gt; the number of execution engines&lt;/em&gt;).&lt;/p&gt;\n&lt;p&gt;In PREDA, the scopes are defined by fine-grained boundaries of contract states. The actual partitioning strategy is left to the hosting execution engine.&lt;/p&gt;\n&lt;h3&gt;Relaying&lt;/h3&gt;\n&lt;p&gt;A function initiating a transaction must trigger a λ-relay to execute on another k-scope. The λ-relay is converted into a relay transaction by the host. The relay transaction will be passed to the memory pool as an unordered pending transaction in the destination engine.&lt;/p&gt;\n&lt;p&gt;Global scope transactions will be executed first before conducting an engine scope.&lt;/p&gt;\n&lt;p&gt;Cross-contract invocation can be carried out immediately without doing a relay transaction.&lt;/p&gt;\n&lt;h3&gt;Syntax&lt;/h3&gt;\n&lt;p&gt;State variable defined and instantiated in a k-scope as:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;var_type @scope var_name;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;@scope&lt;/code&gt; specifies a k-scope. It can be:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;@global&lt;/code&gt;, which is by default, thus can be omitted.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;@engine&lt;/code&gt;, for engine scopes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;@address&lt;/code&gt; or &lt;code&gt;@uint&lt;/code&gt;: a keyed k-scope based on the Solidity elementary type name.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Functions in the k-scope are always defined as:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;function fun_name(arg_type arg,..)&lt;br /&gt;        @scope modifiers returns (ret_type) &amp;#123;&amp;#125;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;@scope&lt;/code&gt; values are identical to the variable definition.&lt;/p&gt;\n&lt;p&gt;In the destination k-scope, the target scope and global variables are merged and available as read-only variables. Symbols defined in the current engine are available for read and write.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;relay @key (var1, var2, ...) &amp;#123;&amp;#125;&lt;br /&gt; relay @global (var1, var2, ..) &amp;#123;&amp;#125;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;The above code defines a relay transaction to continue the execution in another scope. The &lt;code&gt;relay &lt;/code&gt;defines a lambda function that is executed in the destination scope.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;// scope a&lt;br /&gt; relay func_name_k(var1, var2);&lt;br /&gt; // scope b&lt;br /&gt; function func_name_k(var1, var2) @scope public &amp;#123;&amp;#125;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Besides passing a lambda function, Preda can also call a named function as defined above. The named functions must be public.&lt;/p&gt;\n&lt;p&gt;The named transaction could be a cross-contract call as well as:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;relay @key ExtContr(a_addr).named_func_k(var1, var2);&lt;br /&gt; relay ExtContr(a_addr).named_func_k(var1, var2);&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Here, the &lt;code&gt;@key&lt;/code&gt; is defining the scope of the &lt;code&gt;ExtContr&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The mappings are defined as:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;mapping&amp;lt;type =&amp;gt; type&amp;gt; @scope var_name;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Note that any current Solidity smartcontract can be compiled into Preda as is. In this case, all variables and functions will be in the global scope. The global scope is not scalable; therefore, the design goal of the developers is to minimize the global scope.&lt;/p&gt;\n&lt;h3&gt;Potential Execution Engine&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;Multi-core single node.&lt;/li&gt;\n&lt;li&gt;Sharded node&lt;/li&gt;\n&lt;li&gt;Multiple Single Nodes across the internet&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;p&gt;The guideline on how to use Preda is described on Preda Guideline.&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;phishing-by-vera-token&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Phishing by Vera token&quot;],&quot;description&quot;:[0,&quot;2 August 2021&quot;],&quot;date&quot;:[3,&quot;2023-12-21T09:03:00.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;blockchain&quot;],[0,&quot;phishing&quot;],[0,&quot;technology&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;2 August 2021&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Being myself in the crypto industry and as a developer, I never thought I would be scammed. But that happened. And it happened quickly.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;I was using &lt;/span&gt;&lt;a href=\&quot;https://farmfol.io/\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;https://farmfol.io/&lt;/span&gt;&lt;/a&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt; to track my wallet balance. And saw that it has 100K USD. I thought that someone deposited his tokens to me accidentally. So, I researched the token. The token is called Vera. And it’s domain name is &lt;/span&gt;&lt;a href=\&quot;http://thevera.io/\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;http://thevera.io/&lt;/span&gt;&lt;/a&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;The website had a “claim” button. I clicked on it to approve my wallet. Then, I suddenly realized that they might withdraw my crypto wallet. It was on Binance bright chain, where transaction confirmation speed is 3-4 seconds. I was a few seconds late before the transaction was confirmed. As a result, I was screwed for 2BNB (~600$).&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;I tried to remove the token from my wallet but without luck. Then I tried to transfer tokens to an empty address, but that didn’t work either.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Tokens are smart contracts where the token developer programs every token function. The developer of the Vera token puts a high fee on any transaction or completely rejects any method call.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;This case also proved my Blockchain idea that makes users own their wallets and accounts. What is the point of having a private key when the tokens in my balance are without my acknowledgment? Or when I can’t do anything with them because the developers decided like this.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Solution: The Seascape blockchain will have one token with unlimited minting. When users create a new token, they allocate the part of the native token and add an alias name. Since the core part of the token is a native token, the transferring and burning of the token will be available for any user.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Besides that, since all tokens are backed by the native token, through the native token, users will be able to exchange tokens with each other without any dex.&lt;/span&gt;&lt;/p&gt;&quot;]}],[0,{&quot;slug&quot;:[0,&quot;programming-language-rust&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Programming Language: Rust&quot;],&quot;description&quot;:[0,&quot;Rust is a programming language designed by Mozilla Foundation. This is the notes on Rust Book. CLI applications: rustc rustup cargo cargo new &amp;lt;project_name&amp;gt; cargo build // --release for production cargo run cargo check //ensures code compiles but doesn&#39;t build the executable. fn main() {&amp;hellip;&quot;],&quot;date&quot;:[3,&quot;2024-01-05T04:29:59.000Z&quot;],&quot;authors&quot;:[1,[[0,&quot;Medet Ahmetson&quot;]]],&quot;categories&quot;:[1,[]],&quot;tags&quot;:[1,[[0,&quot;technology&quot;],[0,&quot;rust&quot;],[0,&quot;programming-language&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&lt;p&gt;Rust is a programming language designed by Mozilla Foundation.&lt;/p&gt;\n&lt;p&gt;This is the notes on &lt;a href=\&quot;https://doc.rust-lang.org/book/ch01-02-hello-world.html\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Rust Book&lt;/a&gt;.&lt;/p&gt;\n&lt;h2&gt;Cheatsheet&lt;/h2&gt;\n&lt;p&gt;CLI applications:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;rustc&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;rustup&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;cargo&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;cargo new &amp;lt;project_name&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;cargo build // --release for production&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;cargo run&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;cargo check //ensures code compiles but doesn&#39;t build the executable.&lt;/code&gt;&lt;/p&gt;\n&lt;h2&gt;Hello World&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;fn main() &amp;#123; &lt;br /&gt;  println!(\&quot;Hello, World!\&quot;);&lt;br /&gt;&amp;#125;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Write the code above in &lt;code&gt;hello.rs&lt;/code&gt;. Open the terminal, and type: &lt;code&gt;rustc ./hello.rs&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;In rust, there must always be a primary function. It&#39;s a starting point of the application. The functions must always have curly braces.&lt;/p&gt;\n&lt;p&gt;The&lt;code&gt; println!&lt;/code&gt; is a macro. Macros always end with an exclamation mark.&lt;/p&gt;\n&lt;h2&gt;Hello, Cargo&lt;/h2&gt;\n&lt;p&gt;Cargo is the package and system manager for Rust. It handles downloading libraries, building the binary, and many other tasks.&lt;/p&gt;\n&lt;p&gt;The libraries that the program uses are called dependencies.&lt;/p&gt;\n&lt;p&gt;Create a cargo project using &lt;code&gt;cargo new &amp;lt;project_name&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The cargo automatically creates version control files using Git as a default VCS.&lt;/p&gt;\n&lt;p&gt;In the project structure using cargo, all files are stored in the &lt;code&gt;src &lt;/code&gt;directory. The parameters of the program are defined in the &lt;code&gt;Cargo.toml&lt;/code&gt; configuration file.&lt;/p&gt;\n&lt;p&gt;Build the project using &lt;code&gt;cargo build &lt;/code&gt;command. Run the program using &lt;code&gt;cargo run&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h1&gt;Syntax&lt;/h1&gt;\n&lt;p&gt;[&lt;em&gt;associative function&lt;/em&gt;]&lt;/p&gt;\n&lt;p&gt;The string is the standard data type in Rust. &lt;code&gt;::&lt;/code&gt; in &lt;code&gt;String::new()&lt;/code&gt; calls the associative function. The associative function is the function that is implemented on the type.&lt;/p&gt;\n&lt;p&gt;[&lt;code&gt;enum&lt;/code&gt;]&lt;/p&gt;\n&lt;p&gt;Enumerations are called in short as &lt;code&gt;enum&lt;/code&gt;, which is the type that can have multiple possible states. We call each possible state a variant.&lt;/p&gt;\n&lt;p&gt; &lt;/p&gt;\n&lt;p&gt;[&lt;em&gt;crate&lt;/em&gt;]&lt;/p&gt;\n&lt;p&gt;The crate is a collection of rust files. &lt;/p&gt;\n&lt;p&gt; &lt;/p&gt;\n&lt;pre class=\&quot;playground\&quot;&gt;&lt;code class=\&quot;language-rust hljs hide-boring\&quot;&gt;&lt;span class=\&quot;hljs-keyword\&quot;&gt;let&lt;/span&gt; a: [&lt;span class=\&quot;hljs-built_in\&quot;&gt;i32&lt;/span&gt;; &lt;span class=\&quot;hljs-number\&quot;&gt;5&lt;/span&gt;] = [&lt;span class=\&quot;hljs-number\&quot;&gt;1&lt;/span&gt;, &lt;span class=\&quot;hljs-number\&quot;&gt;2&lt;/span&gt;, &lt;span class=\&quot;hljs-number\&quot;&gt;3&lt;/span&gt;, &lt;span class=\&quot;hljs-number\&quot;&gt;4&lt;/span&gt;, &lt;span class=\&quot;hljs-number\&quot;&gt;5&lt;/span&gt;];\n&lt;/code&gt;&lt;br /&gt;let a: [i32;
